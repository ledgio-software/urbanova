name: CI

# URBANOVA is a Next.js monorepo — all code lives at the repo root.
# This workflow runs on every PR targeting main.

on:
  pull_request:
    branches:
      - main

jobs:
  ci:
    name: Typecheck / build / validate schema
    runs-on: ubuntu-latest

    # Prisma requires DATABASE_URL + DIRECT_URL at validate and generate time.
    # These are dummy values — no real DB connection is made during CI.
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      DIRECT_URL: postgresql://ci:ci@localhost:5432/ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: TypeScript type check
        run: npm run typecheck

      - name: Build
        run: npm run build
