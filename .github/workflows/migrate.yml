name: Migrate DB

# Runs production migrations on every push to main.
# prisma migrate deploy is idempotent — already-applied migrations are skipped,
# so re-runs are safe. Render/Vercel handle the actual code deploy separately.
#
# Required GitHub Secrets (repo → Settings → Secrets → Actions):
#   DATABASE_URL — direct (non-pooled) Postgres connection string

on:
  push:
    branches:
      - main

jobs:
  migrate:
    name: Apply Prisma migrations to production DB
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
